<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="静读书籍详情">
  <title>书籍详情 - 静读</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a href="#main-content" class="skip-link">跳转到主要内容</a>

  <header class="site-header">
    <nav class="nav-bar" aria-label="主导航">
      <a class="logo" href="index.html">静读</a>
      <ul class="nav-links">
        <li><a href="index.html">书架</a></li>
        <li><a href="about.html">关于</a></li>
      </ul>
    </nav>
  </header>

  <main id="main-content">
    <div class="container">
      <section class="hero" aria-labelledby="book-detail-title">
        <div class="book-cover" id="book-detail-cover" role="img" aria-label="书籍封面">
          <h1 id="book-detail-cover-title">书名</h1>
          <span class="author">作者</span>
        </div>

        <div class="book-info">
          <p style="margin-bottom: 8px; color: var(--muted-color);">
            <a href="index.html">书架</a>
          </p>
          <h1 id="book-detail-title">书名</h1>
          <p class="book-meta" id="book-detail-author">作者 · 章节数</p>
          <p class="synopsis" id="book-detail-synopsis">简介</p>

          <div class="btn-group">
            <a class="btn" id="book-start-link" href="#">开始阅读</a>
            <a class="btn btn-secondary" id="book-toc-link" href="#">查看目录</a>
          </div>
        </div>
      </section>

      <section class="about-section">
        <h2>章节目录</h2>
        <ol class="chapter-preview-list" id="book-chapter-preview">
          <li>正在加载章节...</li>
        </ol>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 静读。BiUH Web Technologies 课程作业。</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
